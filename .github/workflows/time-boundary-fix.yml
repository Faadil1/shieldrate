name: Midnight Time Boundary Repair

on:
  push:
    branches: [winning-intelligence-v4]
    paths:
      - state/TIME-BOUNDARY.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: winning-intelligence-v4
      - name: Repair browser/runtime timestamp units
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/midnight/runtime.ts')
          text = runtime.read_text()
          old = 'BigInt(Math.floor(new Date(request.requestExpiresAt).getTime() / 1000))'
          new = 'BigInt(new Date(request.requestExpiresAt).getTime())'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 runtime second conversions, found {text.count(old)}')
          runtime.write_text(text.replace(old, new))

          hook = Path('src/hooks/useContract.ts')
          text = hook.read_text()
          old = 'new Date(Number(live.credentialExpiresAtEpoch) * 1000).toISOString()'
          new = 'new Date(Number(live.credentialExpiresAtEpoch)).toISOString()'
          if text.count(old) != 1:
              raise SystemExit(f'expected 1 receipt second conversion, found {text.count(old)}')
          hook.write_text(text.replace(old, new))

          issuer = Path('scripts/issue-demo-credential.mjs')
          text = issuer.read_text()
          old_now = 'const now = BigInt(Math.floor(Date.now() / 1000));'
          new_now = 'const now = BigInt(Date.now());'
          old_expiry = '(now + 60n * 60n * 24n * 30n).toString()'
          new_expiry = '(now + 60n * 60n * 24n * 30n * 1000n).toString()'
          if old_now not in text or old_expiry not in text:
              raise SystemExit('issuer timestamp patterns not found')
          issuer.write_text(text.replace(old_now, new_now).replace(old_expiry, new_expiry))
          PY
      - name: Commit repair
        run: |
          git config user.name "shieldrate-ci"
          git config user.email "actions@users.noreply.github.com"
          git add src/midnight/runtime.ts src/hooks/useContract.ts scripts/issue-demo-credential.mjs
          git diff --cached --check
          git commit -m "fix: align Midnight time boundary to Unix milliseconds"
          git push origin HEAD:winning-intelligence-v4
