name: CI

on:
  push:
    branches: [main, midnight-live-integration-v1, ui-ux-judge-experience-v1, ui-ux-trace-max-v2]
  pull_request:

jobs:
  compact:
    name: Compile Compact contract
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Pin Compact compiler
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          compact update 0.31.1
          compact compile --version
      - name: Compile ShieldRate
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          rm -rf .compact-build/shieldrate
          compact compile --compact-path contracts contracts/shieldrate.compact .compact-build/shieldrate
      - name: Upload generated Compact assets
        uses: actions/upload-artifact@v4
        with:
          name: shieldrate-compact-managed
          path: .compact-build/shieldrate
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify (Node ${{ matrix.node }})
    needs: compact
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore generated Compact assets
        uses: actions/download-artifact@v4
        with:
          name: shieldrate-compact-managed
          path: .compact-build/shieldrate
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
