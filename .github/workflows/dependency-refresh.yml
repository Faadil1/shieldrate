name: Dependency Refresh

on:
  push:
    branches: [winning-intelligence-v4]
    paths:
      - state/DEPENDENCY-REFRESH.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: winning-intelligence-v4
      - name: Install Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/download/compact-v0.5.2/compact-installer.sh | sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Pin and compile Compact
        run: |
          export PATH="$HOME/.compact/bin:$PATH"
          compact update 0.31.1
          rm -rf .compact-build/shieldrate
          compact compile --compact-path contracts contracts/shieldrate.compact .compact-build/shieldrate
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Vite and Vitest toolchain
        run: npm install --save-dev vite@8.3.0 vitest@5.0.1 @vitejs/plugin-react@latest
      - name: Audit
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit lockfile refresh
        run: |
          git config user.name "shieldrate-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remediate Vite and Vitest audit findings"
          git push origin HEAD:winning-intelligence-v4
