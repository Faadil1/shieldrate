<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>ShieldRate — Prove your worth. Reveal nothing.</title>
    <meta
      name="description"
      content="ShieldRate lets freelancers prove income, reputation, and credentials using zero-knowledge proofs on Midnight — without exposing personal data."
    />
    <meta name="theme-color" content="#111111" />

    <!-- Favicons (generated via scripts/make-assets.mjs) -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Open Graph / WhatsApp / Slack / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShieldRate" />
    <meta property="og:description" content="Prove your worth. Reveal nothing. ZK reputation on Midnight." />
    <meta property="og:image" content="og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShieldRate" />
    <meta name="twitter:description" content="Prove your worth. Reveal nothing. ZK reputation on Midnight." />
    <meta name="twitter:image" content="og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
